<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found – Panos Kokmotos</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Same security posture as index.html -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'none';
                 style-src 'self';
                 img-src 'none';
                 connect-src 'none';
                 font-src 'none';
                 frame-src 'none';
                 object-src 'none';
                 base-uri 'self';
                 form-action 'none';
                 upgrade-insecure-requests;" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="x-dns-prefetch-control" content="off" />
  <meta name="format-detection"
        content="telephone=no, date=no, address=no, email=no, url=no" />

  <link rel="stylesheet" href="/style.css" type="text/css" />
</head>
<body>
  <header>
    <a href="/" class="logo">PK</a>
    <nav>
      <a href="/#about">About</a>
      <a href="/#projects">Projects</a>
      <a href="/#contact">Contact</a>
    </nav>
  </header>

  <div class="hero">
    <h1 class="error-code">404</h1>
    <p class="role error-role">Page not found</p>
    <p class="tagline">
      That URL doesn't exist. Head back to the homepage.
    </p>
    <div class="hero-links">
      <a class="btn btn-primary" href="/">Go home</a>
      <a class="btn btn-ghost" href="mailto:panos@givelink.app">Contact me</a>
    </div>
  </div>

  <footer>
    &copy; 2026 Panos Kokmotos &mdash; <a href="https://panoskokmotos.com">panoskokmotos.com</a>
  </footer>
</body>
</html>
